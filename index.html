<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Spanian</title>
    <link rel="icon" href="./images/bluelogo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <!-- header image -->
      <picture class="header-img-wrapper">
        <source srcset="./images/header-phone.jpg" media="(max-width: 575px)" />
        <img src="./images/hero.jpg" alt="spain" />
      </picture>
      <div class="header-list-container">
        <!-- burger button -->
        <label for="check-box-input">
          <div class="burger-btn">
            <i class="fa-solid fa-bars"></i>
          </div>
        </label>
        <input type="checkbox" id="check-box-input" />

        <!-- menu list -->
        <nav>
          <ul class="header-list">
            <li class="header-list-item">
              <label for="check-box-input" class="contact-button">
                <span class="mobile-text">Explore Spain</span>
                <span class="laptop-text">Contact Us</span>
              </label>
            </li>
            <li class="header-list-item">
              <a href="./index.html">Madrid</a>
            </li>
            <li class="header-list-item">
              <a href="#">Barcelona</a>
            </li>
            <li class="header-list-item">
              <a href="#">Valencia</a>
            </li>
          </ul>
        </nav>
        <!-- logo image -->
        <img class="logo-img" src="./images/sun-logo.png" alt="logo" />
      </div>
      <!-- header content -->
      <div class="header-content-wrapper">
        <section class="header-content-title">
          <h2 class="right-header-title">Discover the Beauty of Spain</h2>
          <div class="header-content-text">
            <p>
              Explore spain's iconic cities, rich culture, and unforgettable
              experiences.
            </p>
          </div>
        </section>
      </div>
    </header>
<!-- products list -->
<div class="product-container">

  <h2 class="product-main-title">POPULAR CITIES</h2>

  <div class="product-wrapper">

    <section class="product-item">
      <img src="./images/madrid1.jpg" alt="Madrid" class="product-img">
      <hr>
      <div class="product-box">
        <h2>MADRID</h2>
        <button type="button" class="product-btn">Explore</button>
      </div>
    </section>


    <section class="product-item">
      <img src="./images/barcelona1.jpg" alt="Barcelona" class="product-img">
      <hr>
      <div class="product-box">
        <h2>BARCELONA</h2>
        <button type="button" class="product-btn">Explore</button>
      </div>
    </section>


    <section class="product-item">
      <img src="./images/valencia1.jpg" alt="Valencia" class="product-img">
      <hr>
      <div class="product-box">
        <h2>VALENCIA</h2>
        <button type="button" class="product-btn">Explore</button>
      </div>
    </section>

  </div>

</div>
          </section>
        </section>
      </div>
    </div>
  </body>
</html>
